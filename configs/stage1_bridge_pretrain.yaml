trainer_name: CenterStep1_trainer
current_center: BRIDGE

experiment:
  seed: 42
  output_root: outputs/stage1_bridge

center_configs:
  BRIDGE:
    csv_path: data/example_csv/samples.csv
    data_path: /path/to/bridge_dataset
    num_classes: 2

model:
  model_name: SwinUNETRModel
  pretrained_ckpt: weights/foundation_swinunetr.pth
  in_channels: 1
  feature_size: 48

data:
  image_key: image
  label_key: label

device: cuda
gpu: 0
in_channels: 1
feature_size: 48
roi_x: 96
roi_y: 96
roi_z: 96
space_x: 1.5
space_y: 1.5
space_z: 2.0
a_min: -175.0
a_max: 250.0
b_min: 0.0
b_max: 1.0
num_samples: 2
RandFlipd_prob: 0.3
RandRotate90d_prob: 0.3
RandScaleIntensityd_prob: 0.2
RandShiftIntensityd_prob: 0.2

train:
  # This template uses the provided center trainer. Adjust the split counts to
  # the available bridge data. For the paper, Stage 1 used the bridge data to
  # obtain a bridge-adapted Swin UNETR checkpoint.
  num_total: 42
  num_train: 30
  num_val: 6
  num_test: 6
  split_seed: 42
  epochs: 300
  batch_size: 4
  lr: 0.0005
  warmup_epochs: 20
  optimizer: AdamW
  weight_decay: 0.00001
  print_freq: 20
  val_interval: 10
  early_stopping_patience: 30
  early_stop_threshold: 0.001

inference:
  sw_batch_size: 4
  infer_overlap: 0.5

distributed: false
multiprocessing_distributed: false
world_size: 1
rank: 0
dist_url: tcp://127.0.0.1:23456
dist_backend: nccl
workers: 4
resume:
start_epoch: 0
