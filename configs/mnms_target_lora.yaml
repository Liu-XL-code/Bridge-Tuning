model:
  strategy: lora
  lora_targets: [qkv, proj]
  lora_dropout: 0.0
  freeze_encoder_convolutions: false
preprocessing:
  modality: mri
  label_mode: values
  label_values: [1]
  spacing: [1.0, 1.0, 1.5]
  intensity_probability: 0.0
training:
  epochs: 100
  batch_volumes: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  warmup_epochs: 0
  schedule: constant
  decay_bias_and_norm: true
  precision: amp
  early_stop_patience: 10
  selection: final
