# CT-only A/B/C recipe. Supply image manifests and checkpoints locally through the CLI.
model:
  feature_size: 48
  in_channels: 1
  out_channels: 2
  strategy: "lora"
  use_checkpoint: true
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.1
  lora_targets: ["qkv"]
  freeze_encoder_convolutions: true
preprocessing:
  orientation: "RAS"
  spacing: [1.5, 1.5, 2.0]
  roi: [96, 96, 96]
  hu_window: [-175, 250]
  flip_probability: 0.3
  rotate_probability: 0.3
  intensity_probability: 0.2
  patches_per_volume: 2
  geometry_tolerance_mm: 0.001
evaluation:
  overlap: 0.5
  sw_batch_size: 1
  hd95_unit: "voxel"
  empty_mask_hd95: 100
stages:
  A:
    model:
      strategy: "fft"
  B:
    model:
      strategy: "fft"
    training:
      epochs: 200
      batch_volumes: 2
      learning_rate: 0.0001
      weight_decay: 0.01
      warmup_epochs: 10
      seed: 0
      schedule: "cosine"
      decay_bias_and_norm: false
      microbatch_patches: 2
      workers: 0
      precision: "fp32"
      selection: "final"
      validation_interval: 10
      early_stop: false
      loss_smoothing_window: 10
      early_stop_patience: 30
      early_stop_relative_threshold: 0.01
  C:
    model:
      strategy: "lora"
    training:
      epochs: 300
      batch_volumes: 4
      learning_rate: 0.0005
      weight_decay: 0.00001
      warmup_epochs: 20
      seed: 0
      schedule: "cosine"
      decay_bias_and_norm: false
      microbatch_patches: 2
      workers: 0
      precision: "fp32"
      selection: "final"
      validation_interval: 10
      early_stop: true
      loss_smoothing_window: 10
      early_stop_patience: 30
      early_stop_relative_threshold: 0.01
